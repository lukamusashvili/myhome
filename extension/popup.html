<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AgentOS</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 320px;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 16px 0 8px;
      }
      h1:first-of-type {
        margin-top: 0;
      }
      .status {
        font-size: 13px;
        margin-bottom: 8px;
      }
      .status.ok { color: #16a34a; }
      .status.stale { color: #dc2626; }
      .status.none { color: #6b7280; }
      textarea {
        width: 100%;
        height: 70px;
        font-family: monospace;
        font-size: 10px;
        box-sizing: border-box;
        margin-bottom: 8px;
      }
      .brand { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
      .note { font-size: 12px; color: #6b7280; margin-bottom: 4px; line-height: 1.4; }
      button {
        width: 100%;
        padding: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="brand">AgentOS Extension</div>
    <div class="note">Keep this installed and stay logged in to myhome.ge and ss.ge — AgentOS picks up your sessions automatically.</div>

    <h1>myhome.ge token</h1>
    <div id="myhome-status" class="status none">No token captured yet.</div>
    <textarea id="myhome-token" readonly></textarea>
    <button id="myhome-copy">Copy token</button>

    <h1>ss.ge token</h1>
    <div id="ss-status" class="status none">No token captured yet.</div>
    <textarea id="ss-token" readonly></textarea>
    <button id="ss-copy">Copy token</button>

    <script src="popup.js"></script>
  </body>
</html>
