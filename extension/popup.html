<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 320px;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .status {
        font-size: 13px;
        margin-bottom: 8px;
      }
      .status.ok { color: #16a34a; }
      .status.stale { color: #dc2626; }
      .status.none { color: #6b7280; }
      textarea {
        width: 100%;
        height: 70px;
        font-family: monospace;
        font-size: 10px;
        box-sizing: border-box;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>myhome.ge token</h1>
    <div id="status" class="status none">No token captured yet.</div>
    <textarea id="token" readonly></textarea>
    <button id="copy">Copy token</button>
    <script src="popup.js"></script>
  </body>
</html>
